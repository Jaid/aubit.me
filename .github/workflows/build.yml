name: build
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: install
        run: bun install --frozen-lockfile
      - name: lint, test and verify the production build
        run: bun run check
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-verification
          path: out/test/browser/
          retention-days: 14
      - name: static site artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aubit-me-dist
          path: dist/
          if-no-files-found: error
